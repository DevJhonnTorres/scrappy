<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Graphify · Knowledge Graph interactivo</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0a0e17;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#e5e7eb;overflow:hidden}
  header{position:fixed;top:0;left:0;right:0;z-index:50;background:rgba(10,14,23,.92);backdrop-filter:blur(8px);
    border-bottom:1px solid #1f2937;padding:14px 24px;display:flex;align-items:center;gap:16px;justify-content:space-between;flex-wrap:wrap}
  .brand{font-size:20px;font-weight:700;letter-spacing:-.3px}
  .brand span{color:#6366f1}
  .stats{display:flex;gap:22px;flex-wrap:wrap}
  .stat b{color:#a5b4fc;font-size:18px}
  .stat span{color:#9ca3af;font-size:13px;margin-left:4px}
  .tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:rgba(16,185,129,.15);
    color:#10b981;border:1px solid rgba(16,185,129,.4)}
  .graphtop{position:fixed;top:72px;left:0;right:0;bottom:0;z-index:10}
  .graphtop iframe{width:100%;height:100%;border:0;display:block}
  footer{position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(10,14,23,.85);
    border-top:1px solid #1f2937;padding:8px 24px;font-size:12.5px;color:#9ca3af;text-align:center}
  footer a{color:#a5b4fc;text-decoration:none}
  @media(max-width:640px){.stats{display:none}}
</style>
</head>
<body>

<header>
  <div class="brand">Graphify <span>·</span> knowledge graph</div>
  <div class="stats">
    <div class="stat"><b>2.304</b><span>nodos</span></div>
    <div class="stat"><b>5.435</b><span>aristas</span></div>
    <div class="stat"><b>99</b><span>comunidades</span></div>
    <div class="stat"><b>93%</b><span>EXTRACTED</span></div>
  </div>
  <span class="tag">100% local · 0 tokens LLM</span>
</header>

<main class="graphtop">
  <iframe src="graph.html" title="Graphify knowledge graph interactivo"></iframe>
</main>

<footer>
  Grafo del código fuente de <b>Graphify-Labs/graphify</b> (2.304 nodos, navegable) mapeado con <code>graphify . --code-only</code> · haz clic en los nodos para explorar · <a href="https://github.com/DevJhonnTorres/graphify-demo" target="_blank">repo demo</a>
</footer>

</body>
</html>
